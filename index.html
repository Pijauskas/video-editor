<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mano Video Redaktorius</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background: #121212; color: white; }
        .box { background: #1e1e1e; padding: 20px; margin: 20px auto; width: 60%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input[type="text"] { width: 70%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: white; }
        button { padding: 10px 20px; background: #ff0000; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:hover { background: #cc0000; }
        video { max-width: 80%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Mano Video Redaktorius</h1>

    <div class="box">
        <h2>YouTube Siuntėjas</h2>
        <p>Įklijuok YouTube video nuorodą:</p>
        <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
        <br>
        <button onclick="downloadVideo('mp4')">Parsisiųsti MP4</button>
        <button onclick="downloadVideo('mp3')" style="background: #4CAF50;">Parsisiųsti MP3</button>
        <p id="ytStatus" style="margin-top: 15px; font-size: 14px; color: #aaa;"></p>
    </div>

    <div class="box">
        <h2>Kompiuterio Video Grotuvas</h2>
        <input type="file" id="upload" accept="video/*">
        <br>
        <video id="player" controls></video>
    </div>

    <script>
        function downloadVideo(format) {
            const url = document.getElementById('ytUrl').value;
            const status = document.getElementById('ytStatus');
            
            if (!url) {
                status.innerText = "Prašome įvesti YouTube nuorodą!";
                status.style.color = "#ff5555";
                return;
            }

            status.innerText = "Generuojama nuoroda siuntimui...";
            status.style.color = "#ffa500";

            // Siunčiame per savo serverio maršrutą
            window.location.href = `/download?url=${encodeURIComponent(url)}&format=${format}`;
        }

        const upload = document.getElementById('upload');
        const player = document.getElementById('player');

        upload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                player.src = videoURL;
            }
        });
    </script>
</body>
</html>
